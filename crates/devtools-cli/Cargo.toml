[package]
name = "cove-devtools-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Persistent Cove DevTools MCP bridge and command-line tools"

[[bin]]
name = "cove-devtools"
path = "src/main.rs"

[dependencies]
cove-agent.workspace = true
cove-debugger.workspace = true
cove-devtools-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
base64 = "0.22"
getrandom = "0.4"
tiny_http = "0.12"
tempfile.workspace = true
ureq.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
object = { version = "0.40", default-features = false, features = ["read", "std"] }
rustc-demangle = "0.1"
plist = { version = "1.10", default-features = false }
quick-xml = "0.41"

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[build-dependencies]
serde_json.workspace = true

[lints]
workspace = true
