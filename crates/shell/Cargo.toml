[package]
name = "cove-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
links = "cove_shell"
[dependencies]
cove-platform.workspace = true
cove-logging.workspace = true
thiserror.workspace = true

# Screen-colour sampling is a per-window-system backend. Only the target that
# owns the window system links its native bindings; `cove-platform` stays clean.
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
block2.workspace = true
[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", default-features = false, features = [
    "Foundation",
    "Graphics",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_WinRT",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = { version = "0.62.2", default-features = false }
windows-future = { version = "0.3.2", default-features = false }
[build-dependencies]
cc.workspace = true
cove-native-build.workspace = true
[lints]
workspace = true

