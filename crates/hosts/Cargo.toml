[package]
name = "cove-hosts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Platform application hosts (desktop, Android, iOS)"

[features]
default = []
## Links the DevTools crate and exposes `diagnostics::devtools::factory`.
devtools = ["dep:cove-devtools"]

[dependencies]
cove-devtools = { path = "../devtools", optional = true }
cove-composition.workspace = true
cove-ui-compose = { path = "../compose" }
cove-core.workspace = true
cove-platform.workspace = true
cove-graphics.workspace = true
cove-text.workspace = true
cove-imaging.workspace = true
cove-system.workspace = true
cove-logging.workspace = true
cove-alloc.workspace = true
cove-http.workspace = true
serde.workspace = true
serde_json.workspace = true
libc.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cove-runtime.workspace = true
cove-shell.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[lints]
workspace = true

