<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CoveUI · Browser prototype</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header><strong>CoveUI</strong><span>Rust / WebAssembly</span><span id="status">Loading Wasm…</span></header>
  <main>
    <section class="preview">
      <div class="heading"><h1>Cove UI</h1></div>
      <div id="surface" tabindex="0" aria-label="CoveUI preview">
        <canvas id="gpu"></canvas><canvas id="fallback" hidden></canvas>
      </div>
      <p id="stats"></p>
      <div class="keyboard"><button id="increment">Increment</button><button id="reset">Reset</button><button id="theme">Toggle theme</button><span>Keyboard and screen reader controls for the canvas.</span></div>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
