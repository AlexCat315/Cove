[package]
name = "cove-alloc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Allocation tracking and allocation-site sampling for Cove DevTools"

[dependencies]
thiserror.workspace = true

[target.'cfg(any(target_vendor = "apple", all(target_os = "linux", target_env = "gnu")))'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Diagnostics_Debug"] }

[lints]
workspace = true

[[test]]
name = "tracking"
harness = false

[[test]]
name = "no_install"
harness = false

[[test]]
name = "sampling"
harness = false
