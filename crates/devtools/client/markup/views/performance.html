    <section id="view-performance" class="view aux-view" role="tabpanel" aria-labelledby="tab-performance" hidden>
      <header class="aux-header">
        <div class="aux-title">
          <h1>Performance</h1>
          <p id="performance-meta" class="aux-meta">Frame timings, CPU spans and sampled CPU profiles published by the runtime.</p>
        </div>
        <div class="aux-actions">
          <span id="performance-snapshot-badge" class="snapshot-badge" hidden></span>
          <label class="inline-field" for="performance-budget">Budget</label>
          <select id="performance-budget" aria-label="Frame budget from display refresh rate" title="The budget follows the display refresh rate the runtime measures. Choose a rate to override it; runtimes that publish no rate use the rate you select here.">
            <option value="60">60 Hz · 16.7 ms</option>
            <option value="90">90 Hz · 11.1 ms</option>
            <option value="120">120 Hz · 8.3 ms</option>
          </select>
          <label class="check"><input id="performance-follow" type="checkbox"> Follow</label>
          <span id="performance-elapsed" class="recording-label" hidden>Recording</span>
          <button id="performance-start" class="tool-button" type="button" title="Record CPU spans around a real operation">
            <svg class="icon" aria-hidden="true"><use href="#i-record"></use></svg><span>Start trace</span>
          </button>
          <button id="performance-stop" class="tool-button" type="button" title="Stop the CPU trace" disabled>
            <svg class="icon" aria-hidden="true"><use href="#i-stop"></use></svg><span>Stop</span>
          </button>
          <button id="performance-refresh" class="tool-button" type="button" title="Refresh frame timings">
            <svg class="icon" aria-hidden="true"><use href="#i-refresh"></use></svg><span>Refresh</span>
          </button>
          <button id="performance-export" class="tool-button" type="button" title="Export recorded frames and spans" disabled>
            <svg class="icon" aria-hidden="true"><use href="#i-download"></use></svg><span>Export</span>
          </button>
          <button id="performance-import" class="tool-button" type="button" title="Import a performance snapshot">
            <svg class="icon" aria-hidden="true"><use href="#i-upload"></use></svg><span>Import</span>
          </button>
          <input id="performance-file" type="file" accept="application/json,.json" hidden aria-label="Import performance snapshot">
        </div>
      </header>
      <div class="perf-tabs" role="tablist" aria-label="Performance sections">
        <button id="tab-performance-frames" class="perf-tab" data-perf-tab="frames" role="tab" aria-selected="true" aria-controls="performance-frames" type="button">Frames</button>
        <button id="tab-performance-timeline" class="perf-tab" data-perf-tab="timeline" role="tab" aria-selected="false" aria-controls="performance-timeline" tabindex="-1" type="button">Timeline</button>
        <button id="tab-performance-profile" class="perf-tab" data-perf-tab="profile" role="tab" aria-selected="false" aria-controls="performance-profile" tabindex="-1" type="button">CPU Profile</button>
        <button id="tab-performance-components" class="perf-tab" data-perf-tab="components" role="tab" aria-selected="false" aria-controls="performance-components" tabindex="-1" type="button">Components</button>
      </div>
      <div id="performance-content" class="aux-content">
        <div id="performance-frames" class="perf-panel" role="tabpanel" aria-labelledby="tab-performance-frames"></div>
        <div id="performance-timeline" class="perf-panel" role="tabpanel" aria-labelledby="tab-performance-timeline" hidden></div>
        <div id="performance-profile" class="perf-panel" role="tabpanel" aria-labelledby="tab-performance-profile" hidden></div>
        <div id="performance-components" class="perf-panel" role="tabpanel" aria-labelledby="tab-performance-components" hidden>
          <form id="component-activity-filter" class="aux-actions">
            <input name="text" type="search" aria-label="Component name" placeholder="Filter components" maxlength="256">
            <select name="sort" aria-label="Rank components by">
              <option value="build">Rebuilds</option>
              <option value="layout">Layouts</option>
              <option value="paint">Paints</option>
            </select>
            <button class="tool-button" type="submit">Apply</button>
          </form>
          <div id="component-activity-content"></div>
        </div>
      </div>
    </section>
