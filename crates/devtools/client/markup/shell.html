<header class="app-header">
  <div class="brand" aria-label="Cove DevTools">
    <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
    <span class="brand-name">Cove</span>
    <span class="brand-product">DevTools</span>
  </div>

  <div class="target-bar">
    <label class="sr-only" for="targets">Target</label>
    <select id="targets" aria-label="Target" disabled>
      <option value="">Loading targets…</option>
    </select>
    <button id="refresh" class="icon-button" type="button" title="Refresh targets (R)" aria-label="Refresh targets">
      <svg class="icon" aria-hidden="true"><use href="#i-refresh"></use></svg>
    </button>
    <span id="connection" class="status-pill is-offline" role="status">
      <span class="status-dot" aria-hidden="true"></span>
      <span id="connection-text">Disconnected</span>
    </span>
  </div>


  <div class="header-actions">
    <button id="shortcuts-button" class="icon-button" type="button" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">
      <svg class="icon" aria-hidden="true"><use href="#i-keyboard"></use></svg>
    </button>
    <button id="theme-button" class="icon-button" type="button" title="Theme: follow system" aria-label="Theme: follow system">
      <svg class="icon" aria-hidden="true"><use id="theme-icon" href="#i-auto"></use></svg>
    </button>
  </div>
</header>

<div class="app-body">
  <nav class="rail" aria-label="DevTools sections">
    <div class="rail-tabs" role="tablist" aria-orientation="vertical" aria-label="DevTools sections">
      <button class="rail-tab" id="tab-inspector" data-view="inspector" role="tab" aria-selected="true" aria-controls="view-inspector" type="button">
        <svg class="icon" aria-hidden="true"><use href="#i-hierarchy"></use></svg><span>Inspector</span>
      </button>
      <button class="rail-tab" id="tab-network" data-view="network" role="tab" aria-selected="false" aria-controls="view-network" tabindex="-1" type="button">
        <svg class="icon" aria-hidden="true"><use href="#i-network"></use></svg><span>Network</span><span class="rail-badge" id="network-badge" hidden></span>
      </button>
      <button class="rail-tab" id="tab-logs" data-view="logs" role="tab" aria-selected="false" aria-controls="view-logs" tabindex="-1" type="button">
        <svg class="icon" aria-hidden="true"><use href="#i-logs"></use></svg><span>Logs</span><span class="rail-badge" id="logs-badge" hidden></span>
      </button>
      <button class="rail-tab" id="tab-performance" data-view="performance" role="tab" aria-selected="false" aria-controls="view-performance" tabindex="-1" type="button">
        <svg class="icon" aria-hidden="true"><use href="#i-timer"></use></svg><span>Performance</span><span class="rail-recording" id="performance-recording-dot" hidden aria-label="Trace recording"></span>
      </button>
      <button class="rail-tab" id="tab-memory" data-view="memory" role="tab" aria-selected="false" aria-controls="view-memory" tabindex="-1" type="button">
        <svg class="icon" aria-hidden="true"><use href="#i-memory"></use></svg><span>Memory</span>
      </button>
      <button class="rail-tab" id="tab-app-size" data-view="app-size" role="tab" aria-selected="false" aria-controls="view-app-size" tabindex="-1" type="button">
        <svg class="icon" aria-hidden="true"><use href="#i-package"></use></svg><span>App Size</span>
      </button>
      <button class="rail-tab" id="tab-deep-links" data-view="deep-links" role="tab" aria-selected="false" aria-controls="view-deep-links" tabindex="-1" type="button">
        <svg class="icon" aria-hidden="true"><use href="#i-link"></use></svg><span>Deep Links</span>
      </button>
      <button class="rail-tab" id="tab-debugger" data-view="debugger" role="tab" aria-selected="false" aria-controls="view-debugger" tabindex="-1" type="button">
        <svg class="icon" aria-hidden="true"><use href="#i-bug"></use></svg><span>Debugger</span><span class="rail-paused" id="debugger-badge" hidden></span>
      </button>
      <button class="rail-tab" id="tab-state" data-view="state" role="tab" aria-selected="false" aria-controls="view-state" tabindex="-1" type="button">
        <svg class="icon" aria-hidden="true"><use href="#i-hierarchy"></use></svg><span>State</span>
      </button>
      <button class="rail-tab" id="tab-extensions" data-view="extensions" role="tab" aria-selected="false" aria-controls="view-extensions" tabindex="-1" type="button">
        <svg class="icon" aria-hidden="true"><use href="#i-extension"></use></svg><span>Extensions</span>
      </button>
    </div>
    <div class="rail-meta" id="rail-meta"></div>
  </nav>

  <main id="main" tabindex="-1">
