<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cove DevTools</title>
<link rel="stylesheet" href="/inspector.css">
<header>
  <div class="toolbar">
    <strong>Cove DevTools</strong>
    <select id="targets" aria-label="Target"><option value="">Select a target</option></select>
    <button id="refresh">Refresh</button>
    <span id="status" role="status"></span>
  </div>
  <div id="binding" class="toolbar" hidden>
    <select id="platform-target" aria-label="Platform target"></select>
    <button id="bind">Bind</button>
  </div>
</header>
<main>
  <section aria-label="Target capture">
    <select id="scope" aria-label="Capture scope">
      <option value="window">Window</option><option value="display">Display</option>
    </select>
    <button id="snap" disabled>Capture</button>
    <a id="save" download="cove-capture.png" hidden>Save PNG</a>
    <input id="key" aria-label="Key" size="9" value="Enter">
    <button id="press" disabled>Press</button>
    <input id="text" aria-label="Text" size="12">
    <button id="type" disabled>Type</button>
    <img id="capture" alt="Target screenshot" draggable="false" hidden>
  </section>
  <section aria-label="Diagnostics">
    <button id="tree" disabled>Components</button>
    <button id="native" disabled>Native UI</button>
    <button id="logs" disabled>Logs</button>
    <button id="timing" disabled>Timings</button>
    <button id="trace-start" disabled>Start trace</button>
    <button id="trace-stop" disabled>Stop trace</button>
    <div id="nodes" hidden></div>
    <pre id="details" tabindex="0"></pre>
  </section>
</main>
<script type="module" src="/inspector.js"></script>
</html>
