[package]
name = "cove-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Media control, retained frame output and optional GStreamer integration"

[features]
default = []
gst = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video", "dep:gstreamer-audio"]

[dependencies]
cove-logging.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gstreamer = { workspace = true, optional = true }
gstreamer-app = { workspace = true, optional = true }
gstreamer-video = { workspace = true, optional = true }
gstreamer-audio = { workspace = true, optional = true }

[lints]
workspace = true

[[example]]
name = "headless"
required-features = ["gst"]
