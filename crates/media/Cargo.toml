[package]
name = "cove-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Media control, retained frame output and optional FFmpeg integration"

[features]
default = []
ffmpeg = ["dep:ffmpeg-sys-next", "dep:cpal", "dep:cove-http"]

[dependencies]
cove-logging.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ffmpeg-sys-next = { workspace = true, optional = true }
cpal = { workspace = true, optional = true }
cove-http = { workspace = true, optional = true }
libc.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
ndk-context.workspace = true

[lints]
workspace = true
