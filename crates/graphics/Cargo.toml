[package]
name = "cove-graphics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
cove-core.workspace = true
cove-text.workspace = true
cove-imaging.workspace = true
base64 = "0.22"
sha2 = "0.10"
cove-platform.workspace = true
cove-logging.workspace = true

[build-dependencies]
cc.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
    "Win32_Graphics_Dxgi_Common",
    "Win32_UI_WindowsAndMessaging",
] }

# The Metal backend talks to the Objective-C frameworks directly; these crates
# are only compiled on Apple targets so Windows/Linux builds stay unaffected.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = "0.3"
objc2-quartz-core = "0.3"
block2 = "0.6"
# `MTLDevice.newLibraryWithData:error:` consumes a `dispatch_data_t`, so loading
# a precompiled `.metallib` goes through `DispatchData`.
dispatch2 = "0.3"

[lints]
workspace = true

