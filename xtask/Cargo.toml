[package]
name = "cove-package"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Bundles, signs and deploys Cove applications; run as `cargo xtask`"
default-run = "cove-package"

[[bin]]
name = "cove-package"
path = "src/main.rs"

[[bin]]
name = "cargo-cove"
path = "src/cargo_main.rs"

[dependencies]
clap.workspace = true
serde_json.workspace = true
cove-native-build.workspace = true
toml = "1.2.0"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
