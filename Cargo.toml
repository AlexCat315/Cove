[workspace]
members = [
    "crates/core",
    "crates/platform",
    "crates/system",
    "crates/watch",
    "crates/alloc",
    "crates/logging",
    "crates/graphics",
    "crates/text",
    "crates/imaging",
    "crates/media",
    "crates/media-rhi",
    "crates/shell",
    "crates/runtime",
    "crates/compose",
    "crates/composition",
    "crates/composition-macros",
    "crates/terminal",
    "crates/native-build",
    "crates/hosts",
    "crates/agent",
    "crates/http",
    "crates/devtools",
    "crates/devtools-protocol",
    "crates/devtools-cli",
    "crates/debugger",
    "crates/profiling",
    "crates/addons",
    "xtask",
    "crates/browser",
    "examples/gallery",
]
resolver = "3"

[workspace.package]
version = "0.3.0-dev"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
repository = "https://github.com/AlexCat315/Cove"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
addr2line = "0.27"
mach2 = "0.6"
taffy = { version = "0.15.1", default-features = false, features = ["std", "flexbox", "grid", "calc"] }
cc = "1"
cmake = "0.1"
cove-native-build = { path = "crates/native-build" }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
libc = "0.2"
os_pipe = "1"
unicode-general-category = "1"
unicode-segmentation = "1"
cove-core = { path = "crates/core" }
cove-platform = { path = "crates/platform" }
cove-system = { path = "crates/system" }
cove-watch = { path = "crates/watch" }
cove-alloc = { path = "crates/alloc" }
cove-logging = { path = "crates/logging" }
cove-graphics = { path = "crates/graphics" }
cove-text = { path = "crates/text" }
cove-imaging = { path = "crates/imaging" }
cove-media = { path = "crates/media" }
cove-media-rhi = { path = "crates/media-rhi" }
ffmpeg-sys-next = { version = "=9.0.1", default-features = false, features = [
    "build",
    # No `-march/-mtune=native`: shipped binaries must run on any CPU of the
    # target, and cl.exe does not understand the GCC flags.
    "build-portable",
    "avcodec",
    "avfilter",
    "avformat",
    "swresample",
    "swscale",
] }
cpal = { version = "0.18.2", default-features = false }
ndk-context = "0.1"
cove-shell = { path = "crates/shell" }
cove-runtime = { path = "crates/runtime" }
cove-composition = { path = "crates/composition" }
cove-composition-macros = { path = "crates/composition-macros" }
cove-agent = { path = "crates/agent" }
cove-http = { path = "crates/http" }
cove-devtools-protocol = { path = "crates/devtools-protocol" }
cove-debugger = { path = "crates/debugger" }
cove-profiling = { path = "crates/profiling" }
ureq = { version = "3.5.1", default-features = false, features = ["json"] }
# CommonMark + GFM tables/strikethrough/task lists. The Swift original used
# swift-markdown (cmark-gfm); this is the closest vetted equivalent. Pure Rust,
# four small transitive crates, no build script, works on every target
# including Wasm — which is why it replaces a hand-written parser subset.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-foundation = "0.3"
objc2-metal = "0.3"
objc2-quartz-core = "0.3"
objc2-web-kit = "0.3"
block2 = "0.6"
dispatch2 = "0.3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# Kept as a warning rather than deny so the CI `cargo clippy` step reports it
# without failing the build (the CI no longer treats Clippy warnings as errors).
undocumented_unsafe_blocks = "warn"

[package]
name = "cove-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cove cross-platform UI toolkit"

[features]
default = ["devtools"]
## Links the DevTools server so `COVE_DEVTOOLS=1` starts it in debug builds.
devtools = ["cove-hosts/devtools"]

[dependencies]
cove-text.workspace = true
cove-imaging.workspace = true
cove-graphics.workspace = true
cove-core.workspace = true
cove-platform.workspace = true
cove-system.workspace = true
cove-watch.workspace = true
cove-logging.workspace = true
cove-devtools-protocol.workspace = true
cove-composition = { path = "crates/composition" }
cove-ui-compose = { path = "crates/compose" }
cove-terminal = { path = "crates/terminal" }
cove-hosts = { path = "crates/hosts" }
cove-devtools = { path = "crates/devtools" }
cove-ui-addons = { path = "crates/addons" }
cove-browser = { path = "crates/browser" }

[lints]
workspace = true

[profile.release]
lto = "thin"
codegen-units = 1

# Pinned copy of ffmpeg-sys-next whose build script loads Cove's MSVC + MSYS2
# setup environment in-process; upstream only sees the ambient process PATH.
[patch.crates-io]
ffmpeg-sys-next = { path = "third-party/ffmpeg-sys-next" }
