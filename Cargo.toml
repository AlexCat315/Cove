[workspace]
members = [
    ".",
    "Core",
    "PlatformCore",
    "System",
    "Logging",
    "Graphics",
    "Text",
    "Imaging",
    "Shell",
    "Runtime",
    "Compose",
    "Compose/Composition",
    "Compose/CompositionMacros",
    "Terminal",
    "Hosts",
    "DevTools",
    "DevTools/Protocol",
    "Sources",
    "Tools/Package",
    "Browser",
    "Examples",
    "Examples/RustCounter",
    "Examples/Mobile",
]
resolver = "3"

[workspace.package]
version = "0.3.0-dev"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/AlexCat315/Cove"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
cc = "1"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
libc = "0.2"
os_pipe = "1"
unicode-general-category = "1"
unicode-segmentation = "1"
cove-core = { path = "Core" }
cove-platform = { path = "PlatformCore" }
cove-system = { path = "System" }
cove-logging = { path = "Logging" }
cove-graphics = { path = "Graphics" }
cove-text = { path = "Text" }
cove-imaging = { path = "Imaging" }
cove-shell = { path = "Shell" }
cove-runtime = { path = "Runtime" }
cove-composition = { path = "Compose/Composition" }
cove-composition-macros = { path = "Compose/CompositionMacros" }
cove-devtools-protocol = { path = "DevTools/Protocol" }
# CommonMark + GFM tables/strikethrough/task lists. The Swift original used
# swift-markdown (cmark-gfm); this is the closest vetted equivalent. Pure Rust,
# four small transitive crates, no build script, works on every target
# including Wasm — which is why it replaces a hand-written parser subset.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-foundation = "0.3"
objc2-metal = "0.3"
objc2-quartz-core = "0.3"
objc2-web-kit = "0.3"
block2 = "0.6"
dispatch2 = "0.3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[package]
name = "cove-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cove Rust foundation; UI migration is in progress"

[lib]
path = "rust/lib.rs"

[dependencies]
cove-text.workspace = true
cove-imaging.workspace = true
cove-graphics.workspace = true
cove-core.workspace = true
cove-platform.workspace = true
cove-system.workspace = true
cove-logging.workspace = true
cove-devtools-protocol.workspace = true
cove-composition = { path = "Compose/Composition" }
cove-ui-compose = { path = "Compose" }
cove-terminal = { path = "Terminal" }
cove-hosts = { path = "Hosts" }
cove-devtools = { path = "DevTools" }
cove-ui-addons = { path = "Sources" }
cove-browser = { path = "Browser" }

[lints]
workspace = true

[profile.release]
lto = "thin"
codegen-units = 1
