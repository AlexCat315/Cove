[workspace]
members = [
    ".",
    "crates/core",
    "crates/platform",
    "crates/system",
    "crates/logging",
    "crates/graphics",
    "crates/text",
    "crates/imaging",
    "crates/shell",
    "crates/runtime",
    "crates/compose",
    "crates/composition",
    "crates/composition-macros",
    "crates/terminal",
    "crates/hosts",
    "crates/agent",
    "crates/http",
    "crates/devtools",
    "crates/devtools-protocol",
    "crates/addons",
    "xtask",
    "crates/browser",
    "examples/gallery",
    "examples/counter",
    "examples/mobile",
]
resolver = "3"

[workspace.package]
version = "0.3.0-dev"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/AlexCat315/Cove"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
cc = "1"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
libc = "0.2"
os_pipe = "1"
unicode-general-category = "1"
unicode-segmentation = "1"
cove-core = { path = "crates/core" }
cove-platform = { path = "crates/platform" }
cove-system = { path = "crates/system" }
cove-logging = { path = "crates/logging" }
cove-graphics = { path = "crates/graphics" }
cove-text = { path = "crates/text" }
cove-imaging = { path = "crates/imaging" }
cove-shell = { path = "crates/shell" }
cove-runtime = { path = "crates/runtime" }
cove-composition = { path = "crates/composition" }
cove-composition-macros = { path = "crates/composition-macros" }
cove-agent = { path = "crates/agent" }
cove-http = { path = "crates/http" }
cove-devtools-protocol = { path = "crates/devtools-protocol" }
# CommonMark + GFM tables/strikethrough/task lists. The Swift original used
# swift-markdown (cmark-gfm); this is the closest vetted equivalent. Pure Rust,
# four small transitive crates, no build script, works on every target
# including Wasm — which is why it replaces a hand-written parser subset.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-foundation = "0.3"
objc2-metal = "0.3"
objc2-quartz-core = "0.3"
objc2-web-kit = "0.3"
block2 = "0.6"
dispatch2 = "0.3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[package]
name = "cove-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cove cross-platform UI toolkit"

[dependencies]
cove-text.workspace = true
cove-imaging.workspace = true
cove-graphics.workspace = true
cove-core.workspace = true
cove-platform.workspace = true
cove-system.workspace = true
cove-logging.workspace = true
cove-devtools-protocol.workspace = true
cove-composition = { path = "crates/composition" }
cove-ui-compose = { path = "crates/compose" }
cove-terminal = { path = "crates/terminal" }
cove-hosts = { path = "crates/hosts" }
cove-devtools = { path = "crates/devtools" }
cove-ui-addons = { path = "crates/addons" }
cove-browser = { path = "crates/browser" }

[lints]
workspace = true

[profile.release]
lto = "thin"
codegen-units = 1
