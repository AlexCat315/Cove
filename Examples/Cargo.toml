[package]
name = "cove-examples"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Gallery, demo and mobile example content"

[lib]
path = "rust/lib.rs"

[dependencies]
cove-ui-compose = { path = "../Compose" }
cove-ui-addons = { path = "../Sources" }
cove-terminal = { path = "../Terminal" }
cove-hosts = { path = "../Hosts" }
cove-composition.workspace = true
cove-runtime.workspace = true
cove-core.workspace = true
cove-platform.workspace = true
cove-graphics.workspace = true
cove-imaging.workspace = true
cove-text.workspace = true
cove-logging.workspace = true
serde.workspace = true
unicode-segmentation.workspace = true

# The Counter example's inspection suites drive the DevTools scene inspector and
# the shared scene protocol. Swift's `CounterExampleTests` imported
# `CoveUIDevToolsScene`/`CoveUIDevToolsProtocol` directly, so the equivalents are
# dev-dependencies here: they are test-only and must not leak into the example
# content that ships.
[dev-dependencies]
cove-devtools = { path = "../DevTools" }
cove-devtools-protocol.workspace = true

[lints]
workspace = true

