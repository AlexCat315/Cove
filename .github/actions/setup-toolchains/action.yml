name: Cove SDK toolchains
description: Prepare the Rust and native build tools used by the SDK.
runs:
  using: composite
  steps:
    - name: Report Xcode
      if: runner.os == 'macOS'
      shell: bash
      run: |
        xcodebuild -version
        xcodebuild -showsdks
    - name: Rust toolchain
      shell: bash
      run: rustup show active-toolchain || rustup toolchain install
    - uses: ilammy/msvc-dev-cmd@v1
      if: runner.os == 'Windows'
    - name: Pin MSVC linker
      if: runner.os == 'Windows'
      shell: bash
      run: printf 'CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=%sbin\\HostX64\\x64\\link.exe\n' "$VCToolsInstallDir" >> "$GITHUB_ENV"
    - name: Pinned Zig version
      # Single source of truth: ZIG_VERSION in crates/native-build/src/setup.rs.
      id: zig
      shell: bash
      run: |
        version=$(sed -n 's/^const ZIG_VERSION: &str = "\([^"]*\)";/\1/p' crates/native-build/src/setup.rs)
        test -n "$version" || { echo "ZIG_VERSION missing from setup.rs" >&2; exit 1; }
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - uses: mlugg/setup-zig@v2
      with:
        version: ${{ steps.zig.outputs.version }}
    - name: Linux build and test dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers glslc patchelf xvfb libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev libpipewire-0.3-dev libxcb1-dev libclang-dev libdbus-1-dev libegl-dev libgbm-dev fonts-noto-cjk fonts-noto-color-emoji
