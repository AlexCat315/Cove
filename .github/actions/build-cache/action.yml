name: Swift build cache
description: Restore incremental Swift products for the current toolchain and build inputs.
runs:
  using: composite
  steps:
    - uses: actions/cache/restore@v5
      id: restore
      with:
        path: |
          Tools/Guava/.build
          Tools/Developer/.build
          System/.build
          .build
        key: sdk-swift-v1-${{ runner.os }}-${{ runner.arch }}-6.4.1-${{ hashFiles('**/Package.swift', '**/Package.resolved', '.github/actions/setup-toolchains/action.yml') }}-${{ github.sha }}
        restore-keys: |
          sdk-swift-v1-${{ runner.os }}-${{ runner.arch }}-6.4.1-${{ hashFiles('**/Package.swift', '**/Package.resolved', '.github/actions/setup-toolchains/action.yml') }}-
    # Save after successful compilation, even if a later test reports a failure.
    # The workflow calls cache/save explicitly after the build gate.
outputs:
  key:
    description: Key to save after compilation succeeds.
    value: ${{ steps.restore.outputs.cache-primary-key }}
  hit:
    description: Whether the exact commit was already cached.
    value: ${{ steps.restore.outputs.cache-hit }}
