name: SDK CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: sdk-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: xcode-27
            platform: macos-arm64
          - runner: windows-2025-vs2026
            platform: windows-x86_64
          - runner: ubuntu-24.04
            platform: linux-x86_64
    defaults:
      run:
        shell: bash
    steps:
      - uses: ./.github/actions/checkout-sources
      - uses: ./.github/actions/setup-toolchains
      - name: Prepare native dependencies
        id: native
        run: ./guava setup
      - name: Test standalone CLI
        run: ./guava test Tools/Guava
      - name: Package standalone CLI
        run: ./guava internal package-cli --output "$PWD/dist"
      - name: Verify CLI without a developer toolchain on PATH
        run: |
          mkdir smoke
          tar -xf "dist/guava-${{ matrix.platform }}.tar.gz" -C smoke
          if [ "$RUNNER_OS" = Windows ]; then
            env -i SystemRoot="$SYSTEMROOT" WINDIR="$WINDIR" PATH=/c/Windows/System32 smoke/guava/guava.exe --version
          else
            env -i PATH=/usr/bin:/bin smoke/guava/guava --version
          fi
      - name: Test SDK
        if: ${{ !cancelled() && steps.native.conclusion == 'success' }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a ./guava test . --no-parallel
          else
            ./guava test . --no-parallel
          fi
