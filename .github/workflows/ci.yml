name: Rust foundation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Formatting
        run: ./cove fmt .
      - name: Lints
        run: ./cove clippy . --all-targets --locked
      - name: Foundation contracts
        run: ./cove test . --locked --no-parallel
      - name: Headless checkpoint example
        run: ./cove run Examples/RustCounter --locked
      - name: Record migration inventory
        run: ./cove migration status --json
  ios-foundation:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-ios, aarch64-apple-ios-sim]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --target ${{ matrix.target }}
      - name: Shared Rust foundation
        run: ./cove check . --package cove-ui --target ${{ matrix.target }} --locked
  android-foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --target aarch64-linux-android
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools ndk;30.0.16248370'
      - name: Configure NDK
        run: |
          ndk_cc="$ANDROID_HOME/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          echo "CC_aarch64_linux_android=$ndk_cc" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$ANDROID_HOME/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ndk_cc" >> "$GITHUB_ENV"
      - name: Shared Rust foundation
        run: ./cove check . --package cove-ui --target aarch64-linux-android --locked
