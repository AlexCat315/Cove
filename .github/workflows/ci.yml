name: Rust workspace
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  # `cove-media-rhi` and the desktop suite need the Vulkan loader plus a window
  # system; the loader only advertises VK_KHR_surface when one is present.
  LINUX_NATIVE_PACKAGES: libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers xvfb libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev
concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.17.0'
      - name: Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Pin MSVC linker
        # `shell: bash` re-prepends Git's `/usr/bin` at every step, so GNU
        # coreutils `link.exe` shadows the MSVC linker in PATH lookups.
        if: runner.os == 'Windows'
        run: printf 'CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=%sbin\\HostX64\\x64\\link.exe\n' "$VCToolsInstallDir" >> "$GITHUB_ENV"
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_NATIVE_PACKAGES
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Workspace tests
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a cargo test --workspace --locked --no-fail-fast -- --test-threads=1
          else
            cargo test --workspace --locked --no-fail-fast -- --test-threads=1
          fi
      - name: Audit source layout and migration mappings
        run: cargo xtask audit --json
  media:
    # FFmpeg and its bindings build inside the `ffmpeg-sys-next` build script,
    # so CI runs the same cargo entry points developers use.
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_NATIVE_PACKAGES
      - name: Prepare native build environment
        run: cargo cove setup --media
      - name: Media control and output tests
        run: cargo test --locked -p cove-media --features ffmpeg --all-targets
      - name: Video upload tests
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a cargo test --locked -p cove-media-rhi --features ffmpeg
          else
            cargo test --locked -p cove-media-rhi --features ffmpeg
          fi
      - name: Out-of-tree consumer application
        run: |
          cp -R Tools/MediaSmoke "$RUNNER_TEMP/cove-media-consumer"
          cd "$RUNNER_TEMP/cove-media-consumer"
          sed "s|path = \"../../crates/media\"|path = \"$GITHUB_WORKSPACE/crates/media\"|" Cargo.toml > Cargo.toml.next
          mv Cargo.toml.next Cargo.toml
          cargo build
          cargo test
          cargo run
  media-windows:
    # First-run validation of the Windows install and FFmpeg build path. Remove
    # continue-on-error once a Windows host has passed the same checks as media.
    runs-on: windows-2025
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Prepare native build environment
        run: cargo cove setup --media
      - uses: ilammy/msvc-dev-cmd@v1
      - name: FFmpeg build tools
        # FFmpeg's MSVC configure runs under `sh` and needs MSYS2's make and
        # nasm, and `link` must resolve to the MSVC linker, not coreutils.
        run: |
          echo 'C:\msys64\usr\bin' >> "$GITHUB_PATH"
          rm -f /usr/bin/link.exe /c/msys64/usr/bin/link.exe
          printf 'CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=%sbin\\HostX64\\x64\\link.exe\n' "$VCToolsInstallDir" >> "$GITHUB_ENV"
      - name: Media control and output tests
        # A failed configure prints its log, since the build script only
        # reports "C compiler test failed".
        run: |
          cargo test --locked -p cove-media --features ffmpeg --all-targets || {
            find target -path '*ffmpeg-sys-next*' -name config.log -exec tail -n 60 {} \;
            exit 1
          }
      - name: Out-of-tree consumer application
        run: |
          cp -R Tools/MediaSmoke "$RUNNER_TEMP/cove-media-consumer"
          cd "$RUNNER_TEMP/cove-media-consumer"
          sed "s|path = \"../../crates/media\"|path = \"$GITHUB_WORKSPACE/crates/media\"|" Cargo.toml > Cargo.toml.next
          mv Cargo.toml.next Cargo.toml
          cargo build
          cargo test
          cargo run
  ios-foundation:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-ios, aarch64-apple-ios-sim]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.17.0'
      - name: Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --target ${{ matrix.target }}
      - name: Shared Rust workspace
        run: cargo check --package cove-ui --target ${{ matrix.target }} --locked
  android-foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.17.0'
      - name: Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --target aarch64-linux-android
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools ndk;30.0.16248370'
      - name: Configure NDK
        run: |
          ndk="$ANDROID_HOME/ndk/30.0.16248370"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          # The runner ships another NDK, so name the pinned one for the CMake
          # toolchains in crates/native-build.
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$bin/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$bin/aarch64-linux-android26-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$bin/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
      - name: Shared Rust workspace
        run: cargo check --package cove-ui --target aarch64-linux-android --locked
