name: Native SDK release
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Immutable native artifact revision
        required: true
        default: '1'
env:
  GUAVA_NATIVE_RELEASE_REVISION: ${{ inputs.revision }}
permissions:
  contents: write
jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: xcode-27
            platform: macos-arm64
          - runner: windows-2025-vs2026
            platform: windows-x86_64
          - runner: ubuntu-24.04
            platform: linux-x86_64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/fetch-submodules
      - uses: ./.github/actions/setup-toolchains
      - name: Build and archive native libraries
        run: ./guava internal package-native --output "$PWD/dist"
      - name: Verify SDK against staged native libraries
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a ./guava test . --no-parallel
          else
            ./guava test . --no-parallel
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - name: Merge verified platform metadata
        run: node Tools/Release/merge-native.mjs dist
      - name: Publish immutable native libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("dist/native.json")).version')
          gh release create "native-v$version-r$GUAVA_NATIVE_RELEASE_REVISION" dist/* --target "$GITHUB_SHA" --title "Native libraries $version revision $GUAVA_NATIVE_RELEASE_REVISION" --notes "Native dependency archives verified by the complete SDK tests. Download native.json and commit it to Artifacts/native.json before tagging the SDK." --prerelease --latest=false
      - uses: actions/upload-artifact@v4
        with:
          name: native-manifest
          path: dist/native.json
