name: SDK release
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing SDK version tag to build and publish
        required: true
        type: string
run-name: Release ${{ inputs.tag || github.ref_name }}
permissions:
  contents: write
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
concurrency:
  group: sdk-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Require the completed Rust migration
        run: python3 Tools/Migration/inventory.py --status --require-complete
      - name: Check capability and resource ownership
        run: |
          python3 Tools/Architecture/check.py
          python3 Tools/Architecture/test_check.py
      - name: Verify release metadata
        run: node Tools/Release/check-version.mjs "$RELEASE_TAG" --release
  desktop:
    needs: metadata
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [xcode-27, windows-2025-vs2026, ubuntu-24.04]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: ./.github/actions/fetch-submodules
      - uses: ./.github/actions/setup-toolchains
      - name: Test workspace
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a cargo test --workspace --locked --release -- --test-threads=1
          else
            cargo test --workspace --locked --release -- --test-threads=1
          fi
  mobile:
    needs: metadata
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: aarch64-linux-android
          - runner: xcode-27
            target: aarch64-apple-ios
          - runner: xcode-27
            target: aarch64-apple-ios-sim
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: ./.github/actions/fetch-submodules
      - uses: ./.github/actions/setup-toolchains
      - uses: android-actions/setup-android@v3
        if: matrix.target == 'aarch64-linux-android'
        with:
          packages: 'platform-tools ndk;30.0.16248370'
      - name: Configure NDK
        if: matrix.target == 'aarch64-linux-android'
        run: |
          ndk="$ANDROID_HOME/ndk/30.0.16248370"
          ndk_bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$ndk_bin/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$ndk_bin/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ndk_bin/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
      - name: Build workspace for ${{ matrix.target }}
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --workspace --lib --locked --release --target ${{ matrix.target }}
  publish:
    needs: [desktop, mobile]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Publish the SDK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node Tools/Release/release-notes.mjs > release-notes.md
          gh release create "$RELEASE_TAG" --verify-tag --title "Cove SDK $RELEASE_TAG" --notes-file release-notes.md
