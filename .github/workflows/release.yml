name: SDK release
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing SDK version tag to build and publish
        required: true
        type: string
run-name: Release ${{ inputs.tag || github.ref_name }}
permissions:
  contents: write
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
concurrency:
  group: sdk-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: xcode-27
            platform: macos-arm64
            options: ''
            desktop: true
          - runner: windows-2025-vs2026
            platform: windows-x86_64
            options: ''
            desktop: true
          - runner: ubuntu-24.04
            platform: linux-x86_64
            options: ''
            desktop: true
          - runner: ubuntu-24.04
            platform: android-arm64
            options: '--android'
          - runner: xcode-27
            platform: ios-arm64
            options: '--ios --sdk iphoneos --arch arm64'
          - runner: xcode-27
            platform: ios-arm64-simulator
            options: '--ios --sdk iphonesimulator --arch arm64'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: ./.github/actions/fetch-submodules
      - uses: ./.github/actions/setup-toolchains
      - name: Verify release metadata
        run: node Tools/Release/check-version.mjs "$RELEASE_TAG" --release
      - name: Identify native inputs
        id: native-inputs
        run: echo "digest=$(git ls-tree -r HEAD cmake third-party Runtime/third-party Tools/Cove/Sources/CoveCLI/Toolchains/Native.swift .github/actions/setup-toolchains/action.yml | git hash-object --stdin)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android-arm64'
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        if: matrix.platform == 'android-arm64'
        with:
          packages: 'platform-tools'
      - name: Prepare Android platform tools
        if: matrix.platform == 'android-arm64'
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.1.0" "ndk;30.0.16248370"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - uses: actions/cache@v5
        with:
          key: sdk-native-v3-${{ matrix.platform }}-${{ steps.native-inputs.outputs.digest }}
          path: |
            vendor
            Runtime/vendor
            Artifacts/native
            build/android-validation/native
            build/android-validation/fonts-cmake
      - name: Prepare host libraries
        run: ./cove setup
      - name: Package target libraries
        run: ./cove internal package-native ${{ matrix.options }} --output "$PWD/dist"
      - name: Verify desktop SDK
        if: matrix.desktop
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a ./cove test . --no-parallel
          else
            ./cove test . --no-parallel
          fi
      - name: Verify Android application packaging
        if: matrix.platform == 'android-arm64'
        run: ./cove build Examples/Mobile --android --output "$PWD/dist/mobile-smoke.apk"
      - name: Verify iOS Simulator application
        if: matrix.platform == 'ios-arm64-simulator'
        run: ./cove build Examples/Mobile --ios
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: |
            dist/cove-native-*.tar.gz
            dist/native-*.json
          if-no-files-found: error
  sdk:
    needs: native
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: xcode-27
            platform: macos-arm64
          - runner: windows-2025-vs2026
            platform: windows-x86_64
          - runner: ubuntu-24.04
            platform: linux-x86_64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: ./.github/actions/fetch-submodules
      - uses: ./.github/actions/setup-toolchains
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native
          merge-multiple: true
      - name: Assemble shared SDK libraries and metadata
        run: |
          node Tools/Release/merge-native.mjs native
          mkdir -p Artifacts
          cp native/native.json Artifacts/native.json
          tar -xf "native/cove-native-${{ matrix.platform }}.tar.gz"
      - name: Test SDK management
        run: ./cove test Tools/Cove --timeout 480
      - name: Package complete SDK
        run: ./cove internal package-cli --output "$PWD/dist"
      - name: Verify independent startup
        run: |
          mkdir smoke
          tar -xf "dist/cove-${{ matrix.platform }}.tar.gz" -C smoke
          if [ "$RUNNER_OS" = Windows ]; then
            env -i SystemRoot="$SYSTEMROOT" WINDIR="$WINDIR" PATH=/c/Windows/System32 smoke/cove/cove.exe --version
          else
            env -i PATH=/usr/bin:/bin smoke/cove/cove --version
          fi
          test -f smoke/cove/Package.swift
          test -f smoke/cove/DevTools/Client/Performance/Performance.js
          test -f smoke/cove/Tools/Cove/Sources/CoveCLI/SDK.json
          test -f smoke/cove/Runtime/vendor/SDL3.artifactbundle/info.json
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: sdk
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: sdk-*
          path: sdk
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native
          merge-multiple: true
      - name: Publish one SDK release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release
          find sdk -name '*.tar.gz' -exec cp {} release/ \;
          cp native/cove-native-*.tar.gz release/
          node Tools/Release/merge-native.mjs native
          cp native/native.json release/
          (cd release && sha256sum *.tar.gz | sort > SHA256SUMS)
          cp Tools/Cove/install.sh Tools/Cove/install.ps1 release/
          node Tools/Release/release-notes.mjs > release-notes.md
          gh release create "$RELEASE_TAG" release/* --verify-tag --title "Cove SDK $RELEASE_TAG" --notes-file release-notes.md
