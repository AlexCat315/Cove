[package]
name = "cove-ui-addons"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "WebView and workspace add-on modules"

[lib]
path = "rust/lib.rs"

[dependencies]
cove-composition.workspace = true
# `CoveUIWorkspace` imports `CoveUICompose` in Swift; the workspace tab style and
# panel chrome are authored against the Compose button-style contract.
cove-ui-compose = { path = "../Compose" }
cove-core.workspace = true
cove-platform.workspace = true
serde.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-core-foundation.workspace = true
objc2-foundation.workspace = true
objc2-web-kit.workspace = true

[lints]
workspace = true
