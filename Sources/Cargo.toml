[package]
name = "cove-ui-addons"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "WebView and workspace add-on modules"

[lib]
path = "rust/lib.rs"

[dependencies]
cove-composition.workspace = true
# `CoveUIWorkspace` imports `CoveUICompose` in Swift; the workspace tab style and
# panel chrome are authored against the Compose button-style contract.
cove-ui-compose = { path = "../Compose" }
cove-core.workspace = true
cove-platform.workspace = true
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-core-foundation.workspace = true
objc2-foundation.workspace = true
objc2-web-kit.workspace = true

[lints]
workspace = true

[[test]]
name = "panel_registry"
path = "rust/tests/panel_registry.rs"

[[test]]
name = "panel_sizing"
path = "rust/tests/panel_sizing.rs"

[[test]]
name = "bug_probe"
path = "rust/tests/bug_probe.rs"

[[test]]
name = "web_view_geometry_tests"
path = "rust/tests/web_view_geometry_tests.rs"

[[test]]
name = "web_view_lifecycle_tests"
path = "rust/tests/web_view_lifecycle_tests.rs"

[[test]]
name = "panel_workspace_integration_tests"
path = "rust/tests/panel_workspace_integration_tests.rs"

[[test]]
name = "workspace_controller_tests"
path = "rust/tests/workspace_controller_tests.rs"

[[test]]
name = "workspace_view_tests"
path = "rust/tests/workspace_view_tests.rs"
